name: doompeller
description: "Doom, rewritten natively on Dart + Flutter + flutter_scene."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.47.7

# Versions are pinned exactly. flutter_scene is pre-1.0 and its minor releases
# may break; every bump requires rerunning the renderer probe suite.
dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  # Build-hook inputs for the palette shader bundle (hook/build.dart).
  flutter_gpu_shaders: 0.5.2
  hooks: 2.0.2
  vector_math: 2.4.0
  web: 1.1.1
  doom_wad:
    path: packages/doom_wad
  doom_geometry:
    path: packages/doom_geometry
  doom_core:
    path: packages/doom_core
  doom_music:
    path: packages/doom_music

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - .local/doom/DOOM1.WAD
    # Shader bundles compiled by hook/build.dart for the running engine. Each
    # target's bundles sit in their own directory so a platform ships only
    # the ones it loads.
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms: [ios]
    - path: flutter_scene_generated/metal_desktop/
      platforms: [macos]
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms: [android, linux, windows]
    - path: flutter_scene_generated/opengl_es/
      platforms: [web]
