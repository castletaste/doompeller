name: doompeller
description: "Doom, rewritten natively on Dart + Flutter + Flame 3D."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.4

# Versions are pinned exactly. flame_3d is experimental and has no semver
# guarantees; every bump requires rerunning the renderer probe suite.
dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.0
  flame_3d: 0.3.0
  vector_math: 2.2.0
  meta: 1.18.0
  web: 1.1.1
  doom_wad:
    path: packages/doom_wad
  doom_geometry:
    path: packages/doom_geometry
  doom_core:
    path: packages/doom_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shaders/
