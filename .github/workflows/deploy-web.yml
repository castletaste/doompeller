name: Verify and deploy Doompeller web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: doompeller-${{ github.event_name == 'pull_request' && github.ref || 'cloudflare-pages-production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: false
          pub-cache: false

      - name: Report toolchain
        run: |
          flutter --version
          dart --version
          python3 --version
          cargo --version

      - name: Install naga-cli 30.0.1
        run: |
          cargo install naga-cli --version 30.0.1 --locked --force
          test "$(naga --version)" = "30.0.1"

      - name: Restore exact shareware IWAD cache
        id: iwad-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/doom/DOOM1.WAD
          key: doom-shareware-iwad-1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771

      - name: Fetch or revalidate shareware IWAD
        run: python3 tool/fetch_shareware.py

      - name: Save validated shareware IWAD cache from main
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.iwad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/doom/DOOM1.WAD
          key: doom-shareware-iwad-1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771

      - name: Test shareware fetch and artifact policy
        run: |
          python3 -m unittest discover -s test/tool -p '*_test.py'
          python3 tool/ci_web_artifact_test.py

      - name: Test trusted preview policies
        run: node --test .github/scripts/*.test.cjs

      - name: Resolve locked pure-Dart package dependencies
        run: |
          for package in packages/doom_wad packages/doom_geometry packages/doom_core; do
            (cd "$package" && dart pub get --enforce-lockfile)
          done

      - name: Analyze pure-Dart packages
        run: |
          for package in packages/doom_wad packages/doom_geometry packages/doom_core; do
            (cd "$package" && dart analyze)
          done

      - name: Test pure-Dart packages
        run: |
          for package in packages/doom_wad packages/doom_geometry packages/doom_core; do
            (cd "$package" && dart test)
          done

      - name: Resolve locked app dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze app
        run: flutter analyze

      - name: Test app with original shareware IWAD
        run: flutter test

      - name: Test original E1M1 Wasm regression in Chrome
        run: >-
          flutter test --platform chrome --wasm
          test/e1m1_collision_wasm_regression_test.dart

      - name: Build and verify Wasm-only release
        run: DOOMPELLER_FLUTTER="$(command -v flutter)" bash tool/build_web_release.sh

      - name: Pack verified static bundle
        run: >-
          python3 tool/ci_web_artifact.py pack build/web
          artifacts/doompeller-web-${{ github.sha }}.tar.gz

      - name: Upload verified web bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doompeller-web-${{ github.sha }}
          path: artifacts/doompeller-web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy:
    name: Deploy verified bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://doompeller.castletaste.dev
    permissions:
      actions: read
      contents: read
      deployments: write

    steps:
      - name: Check out trusted deployment tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified web bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: doompeller-web-${{ github.sha }}
          path: artifacts
          digest-mismatch: error

      - name: Extract and revalidate static bundle
        run: >-
          python3 trusted-source/tool/ci_web_artifact.py extract
          artifacts/doompeller-web-${{ github.sha }}.tar.gz
          "${RUNNER_TEMP}/doompeller-site"

      - name: Install pinned Wrangler without deployment credentials
        working-directory: trusted-source/.github/preview-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "if (require('./node_modules/wrangler/package.json').version !== '4.125.0') process.exit(1)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_OFFLINE: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: trusted-source/.github/preview-tools
          wranglerVersion: 4.125.0
          command: >-
            pages deploy ${{ runner.temp }}/doompeller-site
            --project-name=castletaste-doompeller
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
