<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Doom reimplemented natively in Dart, Flutter and Flame 3D.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Doompeller">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Doompeller</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#eee; overscroll-behavior:none; }
    #startup { position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      background:#000; font:16px system-ui,sans-serif; text-align:center; }
    #startup section { max-width:420px; padding:32px; }
    #startup h1 { color:#c8b45a; letter-spacing:.12em; font:700 28px monospace; }
    #startup p { line-height:1.6; color:#bbb; }
    #startup button { color:#000; background:#c8b45a; border:0; border-radius:6px;
      padding:12px 24px; min-height:48px; font:inherit; cursor:pointer; }
    #startup .spinner { margin:28px auto; width:28px; height:28px; border:3px solid #333;
      border-top-color:#c8b45a; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { #startup .spinner { animation:none; } }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite" aria-busy="true">
    <section><h1>DOOMPELLER</h1><div class="spinner" aria-hidden="true"></div>
      <p id="startup-message">Loading the game…</p>
      <button id="startup-retry" hidden type="button">Try again</button>
      <noscript><p>JavaScript is required to start the game.</p></noscript>
    </section>
  </div>
  <script>
    (() => {
      const shell = document.getElementById('startup');
      const message = document.getElementById('startup-message');
      const retry = document.getElementById('startup-retry');
      let complete = false;
      const slow = setTimeout(() => {
        if (!complete) {
          message.textContent = 'Loading is taking longer than usual. Check your connection or try again.';
          retry.hidden = false;
        }
      }, 20000);
      retry.addEventListener('click', () => window.location.reload());
      window.doomLoader = {
        complete() { complete = true; clearTimeout(slow); shell.remove(); },
        fail() {
          if (complete) return;
          clearTimeout(slow);
          shell.setAttribute('aria-busy', 'false');
          shell.querySelector('.spinner').hidden = true;
          message.textContent = 'Could not start the game. Check your connection and use an up-to-date browser, then try again.';
          retry.hidden = false;
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.doomLoader.fail()"></script>
</body>
</html>
